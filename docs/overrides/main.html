{% extends "base.html" %}

{% block extrahead %}
  <meta name="theme-color" content="#0b3b42">
  <meta name="color-scheme" content="light dark">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Oxiland">
  <meta property="og:title" content="{{ page and page.meta and page.meta.title or page and page.title or config.site_name }}">
  <meta property="og:description" content="{{ page and page.meta and page.meta.description or config.site_description }}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ page and page.meta and page.meta.title or page and page.title or config.site_name }}">
  <meta name="twitter:description" content="{{ page and page.meta and page.meta.description or config.site_description }}">
  {{ super() }}
{% endblock %}

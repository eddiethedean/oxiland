site_name: Oxiland
site_description: Safe Rust and Python APIs for RDF models, SPARQL, and streaming RDF I/O on Oxigraph
site_url: https://oxiland.readthedocs.io/
repo_url: https://github.com/eddiethedean/oxiland
repo_name: eddiethedean/oxiland
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
    - content.action.edit

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path:
        - .
        - ..
      check_paths: true

nav:
  - Home: index.md
  - Python:
      - Overview: users/python.md
      - Installation and compatibility: users/python-installation.md
      - Models and RDF terms: users/python-models.md

[package]
name = "oxiland-capi"
version = "0.11.0"
edition = "2024"
rust-version = "1.87"
description = "C ABI for Oxiland (Redland-shaped source-compat; 0.11 librdf packaging)"
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/eddiethedean/oxiland"
homepage = "https://oxiland.readthedocs.io/"
documentation = "https://oxiland.readthedocs.io/"
authors = ["Odo Matthews <odosmatthews@gmail.com>"]
keywords = ["rdf", "sparql", "redland", "ffi", "c-abi"]
categories = ["api-bindings", "parsing"]
publish = false

[lib]
name = "oxiland_capi"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["storage-fjall"]
storage-fjall = ["oxiland/storage-fjall"]
storage-redb = ["oxiland/storage-redb"]
storage-rocksdb = ["oxiland/storage-rocksdb"]
storage-sqlite = ["oxiland/storage-sqlite"]
storage-lmdb = ["oxiland/storage-lmdb"]

[dependencies]
oxiland = { path = "../..", version = "0.10.0", default-features = false }
oxigraph = { version = "=0.5.9", default-features = false }
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[package]
name = "oxiland-cli"
version = "0.13.0"
edition = "2024"
rust-version = "1.87"
description = "Import, inspect, query, and export local RDF datasets"
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/eddiethedean/oxiland"
homepage = "https://oxiland.readthedocs.io/en/latest/users/cli/"
documentation = "https://oxiland.readthedocs.io/en/latest/users/cli/"
authors = ["Odo Matthews <odosmatthews@gmail.com>"]
keywords = ["rdf", "sparql", "semantic-web", "cli"]
categories = ["command-line-utilities"]
publish = true

[lints]
workspace = true

[[bin]]
name = "oxiland-cli"
path = "src/main.rs"

[features]
default = ["storage-fjall"]
storage-fjall = ["oxiland/storage-fjall"]
storage-redb = ["oxiland/storage-redb"]
storage-rocksdb = ["oxiland/storage-rocksdb"]
storage-sqlite = ["oxiland/storage-sqlite"]
storage-lmdb = ["oxiland/storage-lmdb"]

[dependencies]
oxiland = { path = "../..", version = "0.13.0", default-features = false }
clap = { version = "4", features = ["derive"] }
oxigraph = { version = "=0.5.9", default-features = false }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

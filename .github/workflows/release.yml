name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish crates
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # Full history required: check-0.12-release.py / check-0.13-release.py
          # verify evidence revisions are ancestors of the tag tip.
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Verify tag matches package versions
        run: python scripts/check-release-version.py "$GITHUB_REF_NAME"

      - name: Enforce 0.10 qualification-scaffold integrity
        if: startsWith(github.ref_name, 'v0.10.')
        run: python scripts/check-0.10-release.py

      - name: Enforce 0.11 release qualification
        if: startsWith(github.ref_name, 'v0.11.')
        run: python scripts/check-0.11-release.py

      - name: Enforce 0.12 release qualification
        if: startsWith(github.ref_name, 'v0.12.')
        run: |
          python scripts/check-0.11-release.py
          python scripts/check-0.12-release.py

      - name: Enforce 0.13 release qualification
        if: startsWith(github.ref_name, 'v0.13.')
        run: |
          python scripts/check-0.11-release.py
          python scripts/check-0.12-release.py
          python scripts/check-0.13-release.py

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version_exists() {
            curl --fail --silent --show-error \
              "https://crates.io/api/v1/crates/$1/$tag" >/dev/null
          }

          if version_exists oxiland; then
            echo "oxiland $tag is already on crates.io; skipping"
          else
            cargo publish -p oxiland --locked --dry-run
            cargo publish -p oxiland --locked
          fi

          if version_exists oxiland-cli; then
            echo "oxiland-cli $tag is already on crates.io; skipping"
            exit 0
          fi

          # CLI depends on the just-published oxiland version on crates.io.
          for i in 1 2 3 4 5 6 7 8; do
            if cargo publish -p oxiland-cli --locked; then
              exit 0
            fi
            if version_exists oxiland-cli; then
              echo "oxiland-cli $tag became visible after attempt $i"
              exit 0
            fi
            echo "oxiland-cli publish attempt $i failed; waiting for crates.io index…"
            sleep 45
          done
          exit 1

  publish-pypi:
    name: Publish PyPI
    needs: [ci, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/project/oxiland/
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Verify tag matches package versions
        run: python scripts/check-release-version.py "$GITHUB_REF_NAME"

      - name: Download release wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Validate release wheel set
        shell: bash
        run: python scripts/check-python-wheels.py dist --version "${GITHUB_REF_NAME#v}" --copies-per-abi 3

      - name: Attest release wheels
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*.whl

      - name: Publish wheels to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
          skip-existing: true

  github-release:
    name: GitHub release
    needs: [publish, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      # Package while the tree is still clean: downloading wheels into dist/
      # before cargo package makes Cargo refuse the dirty working directory.
      - name: Build reproducible source artifacts
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cargo package -p oxiland --locked
          cargo package -p oxiland-cli --locked
          cp "target/package/oxiland-${version}.crate" dist/
          cp "target/package/oxiland-cli-${version}.crate" dist/
          git archive --format=tar.gz --prefix="oxiland-${version}/" \
            --output="dist/oxiland-${version}-source.tar.gz" "$GITHUB_SHA"

      - name: Download release wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 manifest
        working-directory: dist
        run: sha256sum *.whl *.crate *-source.tar.gz > SHA256SUMS

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.whl dist/*.crate \
              dist/*-source.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.crate \
              dist/*-source.tar.gz dist/SHA256SUMS \
              --generate-notes \
              --title "Oxiland ${GITHUB_REF_NAME#v}" \
              --verify-tag
          fi

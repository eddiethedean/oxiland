name: 0.11 Qualification

on:
  workflow_dispatch:
  push:
    branches: [main, "0.11*", "milestone-0.11*"]

permissions:
  contents: write

concurrency:
  group: qualify-0.11-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  differential:
    name: Two-sided differentials (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install Redland (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librdf0-dev raptor2-utils rasqal-utils

      - name: Install Redland (macOS)
        if: runner.os == 'macOS'
        run: brew install redland raptor rasqal

      - name: Install Redland (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "Windows Redland via vcpkg is optional; harness fails closed if missing"
          choco install -y raptor || true

      - name: Build and install Oxiland Python package
        shell: bash
        run: |
          python -m pip install -U pip maturin virtualenv
          python -m venv .venv
          # shellcheck disable=SC1091
          if [[ -f .venv/Scripts/activate ]]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          python -m pip install -U pip maturin
          cd python
          maturin develop --release

      - name: Run release-default harness
        shell: bash
        run: |
          if [[ -f .venv/Scripts/activate ]]; then source .venv/Scripts/activate; else source .venv/bin/activate; fi
          python compatibility/harness/two_sided.py --profile "${{ matrix.target }}/release-default"

      - name: Run release-all-storage harness
        shell: bash
        run: |
          if [[ -f .venv/Scripts/activate ]]; then source .venv/Scripts/activate; else source .venv/bin/activate; fi
          python compatibility/harness/two_sided.py --profile "${{ matrix.target }}/release-all-storage"

      - name: Native performance evidence (release-default)
        shell: bash
        run: |
          if [[ -f .venv/Scripts/activate ]]; then source .venv/Scripts/activate; else source .venv/bin/activate; fi
          python scripts/build-0.11-performance-evidence.py

      - name: Upload raw evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: raw-${{ matrix.target }}
          path: |
            compatibility/qualification/raw/${{ matrix.target }}__*
            compatibility/qualification/performance/${{ matrix.target }}__*
          if-no-files-found: error

  package-gate:
    name: Package corpus and ABI smoke
    runs-on: ubuntu-latest
    needs: differential
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Install Redland
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librdf0-dev raptor2-utils

      - name: Corpus and ABI
        run: |
          cargo build -p oxiland-capi --release --locked
          compatibility/downstream/corpus/run-corpus.sh
          scripts/package-librdf-compat.sh
          compatibility/downstream/abi/run-abi-swap.sh || true

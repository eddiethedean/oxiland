name: 0.11 Qualification

on:
  workflow_dispatch:
  push:
    branches: [main, "0.11*", "milestone-0.11*"]

permissions:
  contents: write

concurrency:
  group: qualify-0.11-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  differential:
    name: Two-sided differentials (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install Redland (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librdf0-dev raptor2-utils rasqal-utils libraptor2-dev librasqal3-dev pkg-config


      - name: Install Redland (macOS)
        if: runner.os == 'macOS'
        run: brew install redland raptor rasqal

      - name: Install Redland (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@40677d36a502eb2cf0fb808cc9dec31bf6152638 # v2.28.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-raptor
            mingw-w64-ucrt-x86_64-rasqal
            mingw-w64-ucrt-x86_64-redland
          path-type: inherit

      - name: Verify Redland tools on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          command -v rapper
          rapper -v
          command -v rdfproc
          rdfproc -h | head -n 5

      - name: Add MSYS2 UCRT64 tools to PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for d in /d/a/_temp/msys64/ucrt64/bin /c/msys64/ucrt64/bin; do
            if [[ -d "$d" ]]; then
              echo "$d" >> "$GITHUB_PATH"
              echo "Added $d to PATH"
            fi
          done
          command -v rapper || true
          rapper -v || true

      - name: Build and install Oxiland Python package
        shell: bash
        run: |
          python -m pip install -U pip maturin virtualenv
          python -m venv .venv
          # shellcheck disable=SC1091
          if [[ -f .venv/Scripts/activate ]]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          python -m pip install -U pip maturin
          cd python
          maturin develop --release

      - name: Build C oracles (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export PATH="/ucrt64/bin:$PATH"
          export PKG_CONFIG_PATH="/ucrt64/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export CC=/ucrt64/bin/gcc
          export REDLAND_PREFIX=/ucrt64
          echo "CC=$CC"
          ls /ucrt64/lib/lib*rdf* || ls /ucrt64/lib/*rdf* || true
          compatibility/harness/c_oracle/build.sh

      - name: Build C oracles
        if: runner.os != 'Windows'
        shell: bash
        run: compatibility/harness/c_oracle/build.sh

      - name: Run release-default harness
        shell: bash
        run: |
          if [[ -f .venv/Scripts/activate ]]; then source .venv/Scripts/activate; else source .venv/bin/activate; fi
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            for d in /ucrt64 /d/a/_temp/msys64/ucrt64 /c/msys64/ucrt64; do
              if [[ -d "$d/bin" ]]; then
                export PATH="$d/bin:$PATH"
                export REDLAND_PREFIX="$d"
                break
              fi
            done
          fi
          python compatibility/harness/two_sided.py --profile "${{ matrix.target }}/release-default"

      - name: Run release-all-storage harness
        shell: bash
        run: |
          if [[ -f .venv/Scripts/activate ]]; then source .venv/Scripts/activate; else source .venv/bin/activate; fi
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            for d in /ucrt64 /d/a/_temp/msys64/ucrt64 /c/msys64/ucrt64; do
              if [[ -d "$d/bin" ]]; then
                export PATH="$d/bin:$PATH"
                export REDLAND_PREFIX="$d"
                break
              fi
            done
          fi
          python compatibility/harness/two_sided.py --profile "${{ matrix.target }}/release-all-storage"

      - name: Upload raw differential evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: raw-${{ matrix.target }}
          path: compatibility/qualification/raw/${{ matrix.target }}__*
          if-no-files-found: ignore

      - name: Native performance evidence (release-default)
        shell: bash
        run: |
          if [[ -f .venv/Scripts/activate ]]; then source .venv/Scripts/activate; else source .venv/bin/activate; fi
          # Rebuild default-profile artifacts before perf measurement.
          cargo build -p oxiland-capi --release --locked --features storage-fjall
          scripts/package-librdf-compat.sh
          compatibility/harness/c_oracle/build.sh
          python scripts/build-0.11-performance-evidence.py

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-${{ matrix.target }}
          path: compatibility/qualification/performance/${{ matrix.target }}__*
          if-no-files-found: ignore

  package-gate:
    name: Package corpus and ABI smoke
    runs-on: ubuntu-latest
    needs: differential
    if: ${{ always() && !cancelled() }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Install Redland
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librdf0-dev raptor2-utils

      - name: Corpus and ABI
        run: |
          cargo build -p oxiland-capi --release --locked
          compatibility/downstream/corpus/run-corpus.sh
          scripts/package-librdf-compat.sh
          compatibility/downstream/abi/run-abi-swap.sh
          test -f compatibility/qualification/0.11-abi-swap.json

      - name: Upload ABI-swap stamp
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: abi-swap
          path: |
            compatibility/qualification/0.11-abi-swap.json
            compatibility/downstream/abi/abi-swap-result.json
          if-no-files-found: ignore

  release-gate:
    name: Derive parity and check 0.11 release
    runs-on: ubuntu-latest
    needs: [differential, package-gate]
    if: ${{ always() && !cancelled() }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Need full history so soak/fuzz ancestor pins resolve against HEAD.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Download raw differentials
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: raw-*
          path: compatibility/qualification/raw-dl
          merge-multiple: true

      - name: Download performance evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: perf-*
          path: compatibility/qualification/perf-dl
          merge-multiple: true

      - name: Download ABI-swap stamp
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: abi-swap
          path: compatibility/qualification/abi-dl

      - name: Stage evidence and run checker
        run: |
          mkdir -p compatibility/qualification/raw compatibility/qualification/performance
          cp -f compatibility/qualification/raw-dl/*.json compatibility/qualification/raw/ || true
          cp -f compatibility/qualification/perf-dl/*.json compatibility/qualification/performance/ || true
          if [[ -f compatibility/qualification/abi-dl/0.11-abi-swap.json ]]; then
            cp -f compatibility/qualification/abi-dl/0.11-abi-swap.json compatibility/qualification/0.11-abi-swap.json
          elif [[ -f compatibility/qualification/abi-dl/compatibility/qualification/0.11-abi-swap.json ]]; then
            cp -f compatibility/qualification/abi-dl/compatibility/qualification/0.11-abi-swap.json \
              compatibility/qualification/0.11-abi-swap.json
          fi
          python scripts/build-0.11-obligations.py
          python scripts/build-0.11-inventory.py
          python scripts/derive-0.11-parity.py --require-all-profiles
          python scripts/check-0.11-release.py

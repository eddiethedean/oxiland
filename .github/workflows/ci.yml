name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: check

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Docs
        run: cargo doc --no-deps

      - name: Examples
        run: |
          cargo run --example quick_start
          cargo run --example contexts
          cargo run --example parse_serialize
          cargo run --example select
          cargo run --example progressive_load
          cargo run --example construct
          cargo run --example update
          cargo run --example persistent_transaction
          cargo run --example std_replacements

      - name: Inventory
        run: python3 scripts/check-inventory.py

      - name: Documentation links
        run: python3 scripts/check-docs.py

      - name: MkDocs build
        run: |
          python3 -m pip install -r docs/requirements.txt
          mkdocs build --strict

      - name: Public API snapshot
        run: scripts/generate-public-api.sh check

      - name: Install rapper
        run: sudo apt-get update && sudo apt-get install -y raptor2-utils

      - name: I/O oracle smoke
        run: python3 compatibility/harness/oracle_smoke.py

      - name: SPARQL facade smoke
        run: python3 compatibility/harness/sparql_smoke.py

      - name: Utility digest smoke
        run: python3 compatibility/harness/utility_digest_smoke.py

  io-conformance:
    name: RDF I/O conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: io-conformance

      - name: Curated syntax conformance
        run: cargo test --test conformance

      - name: Install rapper
        run: sudo apt-get update && sudo apt-get install -y raptor2-utils

      - name: Differential smoke
        run: python3 compatibility/harness/differential_smoke.py

  fjall:
    name: Fjall
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: fjall

      - name: Test Fjall persistence
        run: cargo test fjall

      - name: Storage matrix
        run: cargo test --test storage

  msrv:
    name: MSRV (1.87)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.87
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUSTDOCFLAGS: -D warnings
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: check

      - name: Verify immutable action references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          errors = []
          for workflow in Path(".github/workflows").glob("*.yml"):
              for number, line in enumerate(workflow.read_text().splitlines(), 1):
                  match = re.search(r"\buses:\s*([^\s#]+)", line)
                  if not match or match.group(1).startswith("./"):
                      continue
                  reference = match.group(1).rsplit("@", 1)[-1]
                  if not re.fullmatch(r"[0-9a-f]{40}", reference):
                      errors.append(f"{workflow}:{number}: {match.group(1)}")
          if errors:
              raise SystemExit("Actions must use full commit SHAs:\n" + "\n".join(errors))
          print("All external actions use immutable commit SHAs")
          PY

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features --locked

      - name: Test core without default features
        run: cargo test -p oxiland --no-default-features --locked

      - name: Rust documentation
        run: cargo doc --workspace --all-features --no-deps --locked

      - name: Examples
        run: |
          cargo run --locked --example quick_start
          cargo run --locked --example contexts
          cargo run --locked --example parse_serialize
          cargo run --locked --example select
          cargo run --locked --example progressive_load
          cargo run --locked --example construct
          cargo run --locked --example update
          cargo run --locked --example persistent_transaction
          cargo run --locked --example std_replacements

      - name: Inventory
        run: |
          python scripts/check-inventory.py
          python scripts/generate-redland-inventory.py --check-only

      - name: Qualification tooling
        run: python -m unittest discover -s scripts/tests -v

      - name: Documentation links
        run: python scripts/check-docs.py

      - name: Build documentation
        run: |
          python -m pip install --requirement docs/requirements.txt
          python -m mkdocs build --strict

      - name: Public API snapshot
        run: scripts/generate-public-api.sh check

      - name: Install RDF oracle
        run: |
          sudo apt-get update
          sudo apt-get install --yes raptor2-utils

      - name: Compatibility smokes
        run: |
          python compatibility/harness/oracle_smoke.py
          python compatibility/harness/sparql_smoke.py
          python compatibility/harness/utility_digest_smoke.py
          python compatibility/harness/cli_smoke.py

  rust-platforms:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust-platforms

      - name: Test workspace
        run: cargo test --workspace --all-features --locked

  semver-package:
    name: Semver and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: semver-package

      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked --version 0.49.0

      - name: Check semver against 0.9.0
        run: cargo semver-checks check-release -p oxiland --baseline-version 0.9.0 --release-type minor

      - name: Verify package versions are aligned
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          python scripts/check-release-version.py "v${version}"

      - name: Verify publishable library crate
        run: cargo publish -p oxiland --locked --dry-run

      - name: Verify CLI install, execute, and uninstall
        run: |
          cargo install --path crates/oxiland-cli --locked --root "$RUNNER_TEMP/oxiland-cli-install"
          "$RUNNER_TEMP/oxiland-cli-install/bin/oxiland-cli" --version
          cargo uninstall oxiland-cli --root "$RUNNER_TEMP/oxiland-cli-install"

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Cache cargo tools
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: security

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      # Tip and release share this gate via reusable CI. R-020: Oxigraph 0.5.9
      # still pins vulnerable quick-xml 0.37; ignore only while the exception
      # script confirms that exact dependency graph.
      - name: Verify narrow upstream security exception
        run: python3 scripts/check-security-exceptions.py

      - name: Audit Rust workspace
        run: cargo audit --file Cargo.lock --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195

      - name: Audit Python native extension
        run: cargo audit --file python/Cargo.lock --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195

      - name: Audit fuzz workspace
        run: cargo audit --file fuzz/Cargo.lock --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195

  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: python/requirements-ci.txt

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: python
          workspaces: "python -> python/target"

      - name: Install test tools
        run: python -m pip install --requirement python/requirements-ci.txt

      - name: Build test wheel
        working-directory: python
        run: maturin build --locked --interpreter python --out dist

      - name: Install test wheel
        run: python -m pip install --no-deps python/dist/*.whl

      - name: Test
        working-directory: python
        run: pytest -q

      - name: Type check
        working-directory: python
        run: pyright

      - name: Examples
        working-directory: python
        run: |
          python examples/quick_start.py
          python examples/parse_serialize.py
          python examples/select.py
          python examples/persistent.py
          python examples/construct.py
          python examples/update.py

  python-wheels:
    name: Python wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: python
          command: build
          args: --release --locked -i 3.10 3.11 3.12 3.13 3.14
          manylinux: auto
          maturin-version: 1.14.1
          rust-toolchain: stable
          sccache: "true"

      - name: Validate wheel metadata and contents
        shell: bash
        run: python scripts/check-python-wheels.py python/target/wheels --copies-per-abi 1

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}
          path: python/target/wheels/*.whl
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  python-wheel-smoke:
    name: Python wheel smoke (${{ matrix.os }} / ${{ matrix.python-version }})
    needs: python-wheels
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheels-${{ matrix.os }}
          path: python/target/wheels

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install and smoke matching wheel
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          abi="${{ matrix.python-version }}"
          abi="${abi/./}"
          wheels=(python/target/wheels/oxiland-*-cp${abi}-cp${abi}-*.whl)
          if (( ${#wheels[@]} != 1 )); then
            echo "Expected one cp${abi} wheel, found ${#wheels[@]}: ${wheels[*]-}"
            exit 1
          fi
          python -m pip install --no-deps "${wheels[0]}"
          python - <<'PY'
          from importlib.metadata import distribution, version
          from pathlib import Path

          import oxiland

          assert oxiland.__version__ == version("oxiland")
          assert oxiland.Model().is_empty()
          root = Path(oxiland.__file__).resolve().parent
          assert (root / "py.typed").is_file()
          assert (root / "__init__.pyi").is_file()
          dist = distribution("oxiland")
          assert not dist.requires or all("extra ==" in item for item in dist.requires)
          assert any("sboms/oxiland-py.cyclonedx.json" in str(item) for item in dist.files or [])
          PY

  release-readiness:
    name: Release readiness
    needs: [python-wheels, python-wheel-smoke, security, semver-package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Download all wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Validate full release wheel set
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' python/pyproject.toml | head -n1)"
          python scripts/check-python-wheels.py dist --version "$version" --copies-per-abi 3

  io-conformance:
    name: RDF I/O conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: io-conformance

      - name: Curated syntax conformance
        run: cargo test --locked --test conformance

      - name: Install RDF oracle
        run: |
          sudo apt-get update
          sudo apt-get install --yes raptor2-utils

      - name: Differential smoke
        run: python3 compatibility/harness/differential_smoke.py

  fjall:
    name: Fjall
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: fjall

      - name: Test Fjall persistence
        run: cargo test --locked fjall

      - name: Storage matrix
        run: |
          cargo test --locked --test storage
          cargo test --locked --features "storage-fjall,storage-redb,storage-sqlite,storage-lmdb" --test backend_conformance

      - name: Optional RocksDB adapter
        run: cargo test --locked --features "storage-fjall,storage-rocksdb" --test backend_conformance

  capi:
    name: C ABI
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Install nightly (sanitizers)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: capi

      - name: Build oxiland-capi
        run: cargo build -p oxiland-capi --locked

      - name: CAPI unit/FFI tests
        run: cargo test -p oxiland-capi --locked

      - name: Exported symbol allowlist
        run: scripts/check-capi-symbols.sh debug

      - name: Downstream smokes
        run: |
          chmod +x compatibility/downstream/run-smokes.sh
          compatibility/downstream/run-smokes.sh

      - name: Compile and run representative C example
        run: |
          cc -I crates/oxiland-capi/include -L target/debug \
            crates/oxiland-capi/examples/preview_workflow.c \
            -loxiland_capi -Wl,-rpath,"$PWD/target/debug" \
            -o target/debug/preview_workflow
          ./target/debug/preview_workflow

      - name: ASan CAPI tests (nightly)
        run: |
          RUSTFLAGS="-Zsanitizer=address" \
            cargo +nightly test -p oxiland-capi --locked \
            --target x86_64-unknown-linux-gnu
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1

  msrv:
    name: MSRV (1.87)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.87
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.87"
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: msrv

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

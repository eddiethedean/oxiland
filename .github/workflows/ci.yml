name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: Check (${{ matrix.rust }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.87", "stable"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}

      - name: Install RocksDB build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev

      - name: Format
        if: matrix.rust == 'stable'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test (all features)
        run: cargo test --all-features

      - name: Test (no default features)
        run: cargo test --no-default-features

      - name: Docs
        run: cargo doc --no-deps --all-features

      - name: Examples
        if: matrix.rust == 'stable'
        run: |
          cargo run --example quick_start
          cargo run --example contexts

      - name: Inventory
        if: matrix.rust == 'stable'
        run: python3 scripts/check-inventory.py

      - name: Public API snapshot
        if: matrix.rust == 'stable'
        run: scripts/generate-public-api.sh check

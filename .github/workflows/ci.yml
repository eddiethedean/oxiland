name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: check

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Docs
        run: cargo doc --no-deps

      - name: Examples
        run: |
          cargo run --example quick_start
          cargo run --example contexts
          cargo run --example parse_serialize
          cargo run --example select
          cargo run --example progressive_load
          cargo run --example construct
          cargo run --example update
          cargo run --example persistent_transaction
          cargo run --example std_replacements

      - name: Inventory
        run: |
          python3 scripts/check-inventory.py
          python3 scripts/generate-redland-inventory.py --check-only

      - name: Documentation links
        run: python3 scripts/check-docs.py

      - name: MkDocs build
        run: |
          python3 -m pip install -r docs/requirements.txt
          mkdocs build --strict

      - name: Public API snapshot
        run: scripts/generate-public-api.sh check

      - name: Install rapper
        run: sudo apt-get update && sudo apt-get install -y raptor2-utils

      - name: I/O oracle smoke
        run: python3 compatibility/harness/oracle_smoke.py

      - name: SPARQL facade smoke
        run: python3 compatibility/harness/sparql_smoke.py

      - name: Utility digest smoke
        run: python3 compatibility/harness/utility_digest_smoke.py

      - name: CLI smoke
        run: python3 compatibility/harness/cli_smoke.py

      - name: Semver check vs 0.5.0
        run: |
          cargo install cargo-semver-checks --locked
          cargo semver-checks check-release -p oxiland --baseline-version 0.5.0

  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: python
          workspaces: "python -> python/target"

      - name: Install maturin and test tools
        run: pip install maturin pytest pyright

      - name: Develop install
        working-directory: python
        run: maturin develop

      - name: Pytest
        working-directory: python
        run: pytest -q

      - name: Type check
        working-directory: python
        run: pyright

      - name: Examples
        working-directory: python
        run: |
          python examples/quick_start.py
          python examples/parse_serialize.py
          python examples/select.py
          python examples/persistent.py

  python-wheels:
    name: Python wheels
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: build
          args: --release -i 3.10 3.11 3.12 3.13
          manylinux: auto
          sccache: "true"

      - name: Smoke install wheel
        shell: bash
        run: |
          pip install python/target/wheels/oxiland-*$(python -c 'import sys; print(f"cp3{sys.version_info.minor}")')*.whl || pip install python/target/wheels/oxiland-*.whl
          python -c "import oxiland; assert oxiland.__version__ == '0.7.0'"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: python/target/wheels/*.whl

  io-conformance:
    name: RDF I/O conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: io-conformance

      - name: Curated syntax conformance
        run: cargo test --test conformance

      - name: Install rapper
        run: sudo apt-get update && sudo apt-get install -y raptor2-utils

      - name: Differential smoke
        run: python3 compatibility/harness/differential_smoke.py

  fjall:
    name: Fjall
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: fjall

      - name: Test Fjall persistence
        run: cargo test fjall

      - name: Storage matrix
        run: cargo test --test storage

  msrv:
    name: MSRV (1.87)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.87
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

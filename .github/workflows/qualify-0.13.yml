name: 0.13 Faster-than-Redland Qualification

on:
  workflow_dispatch:
  push:
    branches: ["0.13*", "milestone-0.13*"]

permissions:
  contents: read

concurrency:
  group: qualify-0.13-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  performance:
    name: Strict perf (${{ matrix.config.target }} run ${{ matrix.run }})
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
        config:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Redland (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librdf0-dev raptor2-utils rasqal-utils libraptor2-dev librasqal3-dev pkg-config

      - name: Install Redland (macOS)
        if: runner.os == 'macOS'
        run: brew install redland raptor rasqal

      - name: Install Redland (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-raptor
            mingw-w64-ucrt-x86_64-rasqal
            mingw-w64-ucrt-x86_64-redland
          path-type: inherit

      - name: Add MSYS2 UCRT64 tools to PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for d in /d/a/_temp/msys64/ucrt64/bin /c/msys64/ucrt64/bin; do
            if [[ -d "$d" ]]; then
              echo "$d" >> "$GITHUB_PATH"
              echo "Added $d to PATH"
            fi
          done

      - name: Build C oracles (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export PATH="/ucrt64/bin:$PATH"
          export PKG_CONFIG_PATH="/ucrt64/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export CC=/ucrt64/bin/gcc
          export REDLAND_PREFIX=/ucrt64
          cargo build -p oxiland-capi --release --locked
          scripts/package-librdf-compat.sh
          compatibility/harness/c_oracle/build.sh

      - name: Build C oracles
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cargo build -p oxiland-capi --release --locked
          scripts/package-librdf-compat.sh
          compatibility/harness/c_oracle/build.sh

      - name: Collect strict 0.13 performance evidence
        timeout-minutes: 340
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            for d in /ucrt64 /d/a/_temp/msys64/ucrt64 /c/msys64/ucrt64; do
              if [[ -d "$d/bin" ]]; then
                export PATH="$d/bin:$PATH"
                export REDLAND_PREFIX="$d"
                break
              fi
            done
          fi
          python scripts/run-0.13-performance.py --run-index "${{ matrix.run }}"

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-0.13-${{ matrix.config.target }}-run${{ matrix.run }}
          path: compatibility/qualification/performance/0.13/${{ matrix.config.target }}__release-default__run${{ matrix.run }}.json
          if-no-files-found: ignore

  release-gate:
    name: Check suite-wide faster-than-Redland
    runs-on: ubuntu-latest
    needs: performance
    if: ${{ always() && !cancelled() }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download performance evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: perf-0.13-*
          path: compatibility/qualification/perf-0.13-dl
          merge-multiple: true

      - name: Require all collector jobs
        if: needs.performance.result != 'success'
        run: |
          echo "One or more strict performance collectors failed (result=${{ needs.performance.result }})."
          exit 1

      - name: Stage evidence and run checker
        run: |
          mkdir -p compatibility/qualification/performance/0.13
          # Artifacts may land flat or nested under the download root.
          find compatibility/qualification/perf-0.13-dl -type f -name '*__release-default__run*.json' \
            -exec cp -f {} compatibility/qualification/performance/0.13/ \;
          ls -la compatibility/qualification/performance/0.13/ || true
          python scripts/check-0.13-release.py

name: 0.12 Qualification

on:
  workflow_dispatch:
  push:
    branches: [main, "0.12*", "milestone-0.12*"]

permissions:
  contents: write

concurrency:
  group: qualify-0.12-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  performance:
    name: Performance evidence (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install Redland (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librdf0-dev raptor2-utils rasqal-utils libraptor2-dev librasqal3-dev pkg-config

      - name: Install Redland (macOS)
        if: runner.os == 'macOS'
        run: brew install redland raptor rasqal

      - name: Install Redland (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@40677d36a502eb2cf0fb808cc9dec31bf6152638 # v2.28.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-raptor
            mingw-w64-ucrt-x86_64-rasqal
            mingw-w64-ucrt-x86_64-redland
          path-type: inherit

      - name: Add MSYS2 UCRT64 tools to PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for d in /d/a/_temp/msys64/ucrt64/bin /c/msys64/ucrt64/bin; do
            if [[ -d "$d" ]]; then
              echo "$d" >> "$GITHUB_PATH"
              echo "Added $d to PATH"
            fi
          done

      - name: Build C oracles (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export PATH="/ucrt64/bin:$PATH"
          export PKG_CONFIG_PATH="/ucrt64/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export CC=/ucrt64/bin/gcc
          export REDLAND_PREFIX=/ucrt64
          cargo build -p oxiland-capi --release --locked
          scripts/package-librdf-compat.sh
          compatibility/harness/c_oracle/build.sh

      - name: Build C oracles
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cargo build -p oxiland-capi --release --locked
          scripts/package-librdf-compat.sh
          compatibility/harness/c_oracle/build.sh

      - name: Collect 0.12 performance evidence
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            for d in /ucrt64 /d/a/_temp/msys64/ucrt64 /c/msys64/ucrt64; do
              if [[ -d "$d/bin" ]]; then
                export PATH="$d/bin:$PATH"
                export REDLAND_PREFIX="$d"
                break
              fi
            done
          fi
          python scripts/build-0.12-performance-evidence.py

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-0.12-${{ matrix.target }}
          path: compatibility/qualification/performance/0.12/${{ matrix.target }}__*
          if-no-files-found: ignore

  release-gate:
    name: Check 0.12 release
    runs-on: ubuntu-latest
    needs: [performance]
    if: ${{ always() && !cancelled() }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Download diagnostic performance evidence
        if: always()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: perf-0.12-*
          path: compatibility/qualification/perf-0.12-dl
          merge-multiple: true

      - name: Check committed 0.12 release evidence
        run: |
          # Release qualification is bound to committed revision-bound samples in
          # the checkout. Fresh CI measurements are retained as diagnostic
          # artifacts only — near-parity gates are too noisy to overwrite the
          # frozen bundle on every push.
          python scripts/check-0.12-release.py
          if [[ -d compatibility/qualification/perf-0.12-dl ]]; then
            echo "Diagnostic CI sample files:"
            ls -la compatibility/qualification/perf-0.12-dl || true
          fi

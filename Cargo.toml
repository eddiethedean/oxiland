[package]
name = "oxiland"
version = "0.4.0"
edition = "2024"
rust-version = "1.87"
description = "Safe Redland-shaped RDF models, SPARQL, stream-oriented RDF I/O, and durable Fjall storage on Oxigraph"
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/eddiethedean/oxiland"
homepage = "https://github.com/eddiethedean/oxiland"
documentation = "https://docs.rs/oxiland"
authors = ["Odo Matthews <odosmatthews@gmail.com>"]
keywords = ["rdf", "sparql", "redland", "oxigraph", "semantic-web"]
categories = ["parsing", "data-structures", "encoding"]
exclude = [".github/", "compatibility/harness/*-result.json"]

[package.metadata.docs.rs]
features = []

[features]
default = []

[dependencies]
oxigraph = { version = "=0.5.9", default-features = false }
spargebra = { version = "=0.4.6", default-features = false, features = ["sep-0002", "sep-0006"] }
fjall = "2.11"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

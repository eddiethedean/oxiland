[workspace]
members = [".", "crates/oxiland-cli", "crates/oxiland-capi"]
exclude = ["python"]
resolver = "2"
default-members = [".", "crates/oxiland-cli", "crates/oxiland-capi"]

[package]
name = "oxiland"
version = "0.11.0"
edition = "2024"
rust-version = "1.87"
description = "Embedded RDF datasets, SPARQL, persistence, and streaming I/O for Rust"
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/eddiethedean/oxiland"
homepage = "https://oxiland.readthedocs.io/"
documentation = "https://docs.rs/oxiland"
authors = ["Odo Matthews <odosmatthews@gmail.com>"]
keywords = ["rdf", "sparql", "redland", "oxigraph", "semantic-web"]
categories = ["parsing", "data-structures", "encoding"]
exclude = [".github/", "compatibility/harness/*-result.json"]

[package.metadata.docs.rs]
features = ["storage-fjall"]

[features]
default = ["storage-fjall"]
tracing = ["dep:tracing"]
storage-fjall = ["dep:fjall"]
storage-redb = ["dep:redb"]
storage-rocksdb = ["dep:rocksdb"]
storage-sqlite = ["dep:rusqlite"]
storage-lmdb = ["dep:heed"]

[dependencies]
oxigraph = { version = "=0.5.9", default-features = false }
spargebra = { version = "=0.4.6", default-features = false, features = ["sep-0002", "sep-0006"] }
fjall = { version = "2.11", optional = true }
redb = { version = "2", optional = true }
rocksdb = { version = "0.22", optional = true, default-features = true }
rusqlite = { version = "0.32", optional = true, features = ["bundled"] }
heed = { version = "0.21", optional = true }
thiserror = "2"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
unicode-normalization = "0.1"
tracing = { version = "0.1", optional = true }

[dev-dependencies]
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

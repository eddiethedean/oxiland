[package]
name = "oxiland"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "A Redland-compatible RDF toolkit backed by Oxigraph"
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/eddiethedean/oxiland"
homepage = "https://github.com/eddiethedean/oxiland"
documentation = "https://docs.rs/oxiland"
authors = ["Odo Matthews <odosmatthews@gmail.com>"]
keywords = ["rdf", "sparql", "redland", "oxigraph", "semantic-web"]
categories = ["database"]
exclude = [".github/"]

[package.metadata.docs.rs]
features = []

[features]
default = []

[dependencies]
oxigraph = { version = "=0.5.9", default-features = false }
redb = "2.6"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

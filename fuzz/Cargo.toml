[package]
name = "oxiland-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.87"

[lints.rust]
future_incompatible = { level = "deny", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
correctness = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
fallible_impl_from = "deny"
todo = "deny"
unimplemented = "deny"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
oxiland = { path = "..", default-features = false }
oxiland-capi = { path = "../crates/oxiland-capi", default-features = false }

[[bin]]
name = "rdf_parser"
path = "fuzz_targets/rdf_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "c_lifecycle"
path = "fuzz_targets/c_lifecycle.rs"
test = false
doc = false
bench = false

[workspace]
